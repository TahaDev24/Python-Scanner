[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-scanner"
version = "0.2.0"
description = "A local-first static code-quality analysis platform for Python projects."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Taha Hesaraki" }]
keywords = ["python", "static-analysis", "code-quality", "security", "maintainability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
desktop = ["kivy>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
python-scanner = "python_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["python_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
